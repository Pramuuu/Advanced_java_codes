<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Books</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Theme -->
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Library Management</a>
        <div>
            <a class="btn btn-outline-light me-2" th:href="@{/books/add}">+ Add Book</a>
            <a class="btn btn-light" th:href="@{/dashboard}">Dashboard</a>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-5">

    <div class="card p-4">

        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Stored Books</h4>
            <span class="badge bg-secondary fs-6"
                  th:text="${#lists.size(books)} + ' Books'"></span>
        </div>

        <!-- If No Books -->
        <div th:if="${#lists.isEmpty(books)}" class="text-center p-5">
            <h5 class="text-muted">No books available.</h5>
            <p class="text-muted">Start by adding a new book to the system.</p>
            <a class="btn btn-primary mt-2" th:href="@{/books/add}">
                Add First Book
            </a>
        </div>

        <!-- Table Section -->
        <div th:if="${!#lists.isEmpty(books)}">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Price (₹)</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}"></td>
                        <td class="fw-semibold" th:text="${book.title}"></td>
                        <td th:text="${book.author}"></td>
                        <td th:text="${book.price}"></td>

                        <td>
                            <a th:href="@{'/books/' + ${book.id}}"
                               class="btn btn-info btn-sm me-2">
                                View
                            </a>

                            <a th:href="@{'/books/delete/' + ${book.id}}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this book?')">
                                Delete
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Back Button -->
    <div class="text-center mt-4">
        <a class="btn btn-primary px-4" th:href="@{/dashboard}">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
