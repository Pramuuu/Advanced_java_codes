<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Details</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Theme -->
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Library Management</a>
        <div>
            <a class="btn btn-outline-light me-2" th:href="@{/books/view}">All Books</a>
            <a class="btn btn-light" th:href="@{/dashboard}">Dashboard</a>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-5">

    <div class="card p-5 col-md-6 mx-auto">

        <h4 class="text-center mb-4">Book Details</h4>

        <!-- If Book Found -->
        <div th:if="${book != null}">

            <div class="mb-3">
                <strong>ID:</strong>
                <span th:text="${book.id}"></span>
            </div>

            <div class="mb-3">
                <strong>Title:</strong>
                <span th:text="${book.title}"></span>
            </div>

            <div class="mb-3">
                <strong>Author:</strong>
                <span th:text="${book.author}"></span>
            </div>

            <div class="mb-4">
                <strong>Price:</strong>
                ₹ <span th:text="${book.price}"></span>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-between">

                <a th:href="@{'/books/delete/' + ${book.id}}"
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to delete this book?')">
                    Delete Book
                </a>

                <a th:href="@{/books/view}"
                   class="btn btn-info">
                    View All Books
                </a>

            </div>

        </div>

        <!-- If Book Not Found -->
        <div th:if="${book == null}" class="text-center">

            <h5 class="text-danger mb-3">Book Not Found</h5>
            <p class="text-muted">The requested book does not exist in the system.</p>

            <a class="btn btn-primary mt-3" th:href="@{/books/view}">
                Go Back to Books
            </a>

        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="text-center mt-4">
        <a class="btn btn-primary px-4" th:href="@{/dashboard}">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
