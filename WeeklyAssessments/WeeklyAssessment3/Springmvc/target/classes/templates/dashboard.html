<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Library Management</a>
        <a class="btn btn-outline-light" th:href="@{/login}">Logout</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card text-center p-5">
        <h3>Welcome to the Library System</h3>
        <p class="text-muted">Manage your books easily and efficiently.</p>

        <div class="mt-4">
            <a class="btn btn-success me-3" th:href="@{/books/add}">Add Book</a>
            <a class="btn btn-info" th:href="@{/books/view}">View Books</a>
        </div>
    </div>

</div>

</body>
</html>
