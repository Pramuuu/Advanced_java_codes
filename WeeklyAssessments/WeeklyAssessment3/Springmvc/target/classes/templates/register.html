<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Theme -->
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4" style="width: 450px;">

    <h4 class="text-center mb-4">Create Account</h4>

    <form th:action="@{/register}"
          th:object="${user}"
          method="post">

        <!-- ID -->
        <div class="mb-3">
            <label class="form-label">User ID</label>
            <input type="number" class="form-control" th:field="*{id}" required>
        </div>

        <!-- Name -->
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" th:field="*{name}">
            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" th:field="*{email}">
            <div class="text-danger" th:errors="*{email}"></div>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" th:field="*{password}">
            <div class="text-danger" th:errors="*{password}"></div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">
                Register
            </button>
        </div>

    </form>

    <div class="text-center mt-3">
        <small>
            Already have an account?
            <a th:href="@{/login}" class="text-decoration-none">Login here</a>
        </small>
    </div>

</div>

</body>
</html>
