<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Library Management</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card p-4 col-md-6 mx-auto">
        <h4 class="mb-4 text-center">Add New Book</h4>

        <form th:action="@{/books/add}" th:object="${book}" method="post">

            <div class="mb-3">
                <label>ID</label>
                <input type="number" class="form-control" th:field="*{id}" required>
            </div>

            <div class="mb-3">
                <label>Title</label>
                <input type="text" class="form-control" th:field="*{title}">
                <div class="text-danger" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label>Author</label>
                <input type="text" class="form-control" th:field="*{author}">
                <div class="text-danger" th:errors="*{author}"></div>
            </div>

            <div class="mb-3">
                <label>Price</label>
                <input type="number" step="0.01" class="form-control" th:field="*{price}">
                <div class="text-danger" th:errors="*{price}"></div>
            </div>

            <div class="d-grid">
                <button class="btn btn-primary">Add Book</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
